# Spring Boot CRM System Configuration

spring.application.name=crm-system

# Server Port
server.port=8080

# -------------------------------------------------------------
# DEFAULT: Embedded H2 Database (Ready to run without MySQL setup)
# -------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:crm_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -------------------------------------------------------------
# MYSQL CONFIGURATION (Uncomment below lines to use MySQL)
# -------------------------------------------------------------
# spring.datasource.url=jdbc:mysql://localhost:3306/crm_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=root
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# JPA / Hibernate Auto DDL Generation
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Defer SQL seed data execution until Hibernate creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Security Configuration
spring.main.allow-circular-references=true
